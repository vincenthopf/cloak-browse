[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cloak-browse"
dynamic = ["version"]
description = "Stealth browser CLI backed by CloakBrowser and browser-harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vincent Hopf" }]
keywords = ["browser", "automation", "cdp", "stealth"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "browser-harness==0.1.10",
  "cloakbrowser==0.5.10",
  "platformdirs==4.11.7",
  "playwright==1.62.0",
  "websockets==15.0.1",
]

[project.urls]
Homepage = "https://github.com/vincenthopf/cloak-browse"
Issues = "https://github.com/vincenthopf/cloak-browse/issues"
Repository = "https://github.com/vincenthopf/cloak-browse"

[project.scripts]
cloak-browse = "cloak_browse.cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.hatch.version]
path = "cloak_browse/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["cloak_browse"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github/workflows",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SKILL.md",
  "/cloak_browse",
  "/findings.md",
  "/pyproject.toml",
  "/scripts",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["cloak_browse", "scripts"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["browser_harness.*", "cloakbrowser.*", "platformdirs.*", "websockets.*"]
ignore_missing_imports = true
