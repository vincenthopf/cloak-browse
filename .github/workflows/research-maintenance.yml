name: Publish final quality fixes

on:
  push:
    branches:
      - research/cloak-browse-escli-docs
    paths:
      - .github/workflows/research-maintenance.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOAK_BROWSE_VERIFY_DEPS: "1"
      CLOAK_BROWSE_CACHE_DIR: ${{ github.workspace }}/.cloak-browse-quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          cat research/quality-fixes/part-* >/tmp/cloak-browse-quality.b64
          base64 --decode /tmp/cloak-browse-quality.b64 >/tmp/cloak-browse-quality.patch
          printf '%s  %s\n' 801692024a8bf4cd99088938b3322ea7188ca9f1658d81126153353293254476 /tmp/cloak-browse-quality.patch | sha256sum -c -
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.0"
          enable-cache: true
      - shell: bash
        run: |
          set -euo pipefail
          branch=maintenance/cloak-browse-hardening
          expected=b6e8601132ad539ba7f8f3431d6068c5812ec8ed
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$expected"
          git switch -C "$branch" "origin/$branch"
          git apply --check /tmp/cloak-browse-quality.patch
          git apply /tmp/cloak-browse-quality.patch
          git diff --check
          uv python install 3.13
          uv sync --frozen --python 3.13
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
          uv run python scripts/check_release.py
          rm -rf dist
          uv build
          uv run python scripts/check_dist.py
          uv venv /tmp/cloak-browse-quality-smoke --python 3.13
          uv pip install --python /tmp/cloak-browse-quality-smoke/bin/python dist/*.whl
          /tmp/cloak-browse-quality-smoke/bin/cloak-browse --help >/dev/null
          /tmp/cloak-browse-quality-smoke/bin/python -c "import json, subprocess; result = subprocess.run(['/tmp/cloak-browse-quality-smoke/bin/cloak-browse', 'status', '--json'], check=True, capture_output=True, text=True); json.loads(result.stdout); assert result.stderr == ''"
          git config user.name "cloak-browse-maintenance[bot]"
          git config user.email "cloak-browse-maintenance[bot]@users.noreply.github.com"
          git add cloak_browse scripts tests
          git commit -m "fix: satisfy cross-platform quality contracts"
          git push origin "HEAD:$branch"
