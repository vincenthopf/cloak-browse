name: Maintenance research

on:
  push:
    branches:
      - research/cloak-browse-escli-docs
    paths:
      - pyproject.toml
      - cloak_browse/_version.py
      - .github/workflows/research-maintenance.yml

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.0"
      - run: uv python install 3.13
      - run: uv lock
      - run: npm install --global @eightstate/escli@0.21.1
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p research
          report="research/escli-docs.md"
          printf '# escli docs research\n\n- escli: %s\n- generated: %s\n\n' "$(escli --version)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$report"
          run_doc() {
            title="$1"
            shift
            printf '## %s\n\n```text\n' "$title" >>"$report"
            set +e
            escli "$@" >>"$report" 2>&1
            code=$?
            set -e
            printf '\n[exit %s]\n```\n\n' "$code" >>"$report"
          }
          run_doc "browser-harness search" docs search browser-harness
          run_doc "CloakBrowser search" docs search cloakbrowser
          run_doc "Playwright process and launch guidance" docs get playwright "Python browser launch, process lifetime, and shutdown" --tokens 3000
          run_doc "Patchright compatibility guidance" docs get patchright "Python backend compatibility with Playwright and proxy authentication" --tokens 2500
          run_doc "websockets sync client guidance" docs get websockets "sync client connect, open timeout, close timeout, and exceptions" --tokens 2500
          run_doc "Hatch dynamic version and distributions" docs get hatch "dynamic version path and wheel sdist configuration" --tokens 3000
          run_doc "GitHub Actions release validation" docs get github-actions "validate exact tag commit before creating a release" --tokens 2500
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "cloak-browse-maintenance[bot]"
          git config user.email "cloak-browse-maintenance[bot]@users.noreply.github.com"
          git add -f uv.lock
          git add research/escli-docs.md
          git commit -m "chore: record escli research and dependency lock"
          git push
