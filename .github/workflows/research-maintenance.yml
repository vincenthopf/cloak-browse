name: Maintenance quality research

on:
  push:
    branches:
      - research/cloak-browse-escli-docs
    paths:
      - .github/workflows/research-maintenance.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: maintenance/cloak-browse-hardening
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.0"
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - shell: bash
        run: |
          set -u
          mkdir -p /tmp/cloak-browse-quality
          uv run ruff check --fix . > /tmp/cloak-browse-quality/ruff-fix.log 2>&1 || true
          uv run ruff format . > /tmp/cloak-browse-quality/ruff-format.log 2>&1 || true
          git diff --binary > /tmp/cloak-browse-quality/ruff.patch
          uv run ruff check . > /tmp/cloak-browse-quality/ruff-check.log 2>&1 || true
          uv run ruff format --check . > /tmp/cloak-browse-quality/ruff-format-check.log 2>&1 || true
          uv run mypy > /tmp/cloak-browse-quality/mypy.log 2>&1 || true
          uv run pytest > /tmp/cloak-browse-quality/pytest.log 2>&1 || true
          rm -rf dist
          uv build > /tmp/cloak-browse-quality/build.log 2>&1 || true
          uv run python scripts/check_dist.py > /tmp/cloak-browse-quality/dist.log 2>&1 || true
          git status --short > /tmp/cloak-browse-quality/status.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloak-browse-quality-research
          path: /tmp/cloak-browse-quality
