name: Export maintenance workspace

on:
  push:
    branches:
      - research/cloak-browse-escli-docs
    paths:
      - .github/workflows/research-maintenance.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git fetch origin maintenance/cloak-browse-hardening
          git archive --format=tar.gz --output=/tmp/cloak-browse-maintenance.tar.gz origin/maintenance/cloak-browse-hardening
          mkdir -p /tmp/recovery
          cp research/escli-docs.md /tmp/recovery/ 2>/dev/null || true
          cat research/quality-fixes/part-* > /tmp/recovery/quality-fixes.parts.b64 2>/dev/null || true
          base64 --decode /tmp/recovery/quality-fixes.parts.b64 > /tmp/recovery/quality-fixes.parts.patch 2>/dev/null || true
          base64 --decode research/quality-fixes.patch.b64 > /tmp/recovery/quality-fixes.patch 2>/dev/null || true
          sha256sum /tmp/recovery/* > /tmp/recovery/SHA256SUMS 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: cloak-browse-recovery
          path: |
            /tmp/cloak-browse-maintenance.tar.gz
            /tmp/recovery
          if-no-files-found: error
          retention-days: 1
